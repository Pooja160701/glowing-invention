rules:
  - id: CS-SECRET-001
    name: Exposed Secret
    description: Detects credentials or secrets exposed in cloud resources.
    severity: critical

    finding_types:
      - sensitive_data
      - misconfiguration

    sources:
      - macie
      - security_hub

    conditions:
      keywords:
        - secret
        - credential
        - access key
        - password
        - token

    remediation: >
      Immediately revoke or rotate the exposed credential, remove the secret
      from the affected resource, and store secrets in AWS Secrets Manager.

    tags:
      - aws
      - secrets
      - credentials
      - incident-response