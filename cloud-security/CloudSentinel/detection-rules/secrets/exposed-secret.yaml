rules:
  - id: CS-SECRET-001
    name: Exposed Secret
    description: Detects credentials or secrets exposed in cloud resources.
    severity: critical

    finding_types:
      - sensitive_data
      - misconfiguration

    sources:
      - macie
      - security_hub

    conditions:
      keywords:
        - exposed secret
        - exposed credential
        - exposed access key
        - exposed password
        - exposed token
        - secret detected
        - credential detected
        - access key exposed
        - password exposed
        - token exposed

    remediation: >
      Immediately revoke or rotate the exposed credential, remove the secret
      from the affected resource, and store secrets in AWS Secrets Manager.

    tags:
      - aws
      - secrets
      - credentials
      - incident-response