id: CT-001
name: Suspicious API Activity
description: >
  Detect potentially suspicious AWS API activity based on unusual
  management-plane operations.

source:
  service: cloudtrail
  event_type: management

severity: high

conditions:
  - event_name:
      - CreateAccessKey
      - CreateLoginProfile
      - AttachUserPolicy
      - AttachRolePolicy
      - PutUserPolicy
      - PutRolePolicy
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - DisableKey
      - ScheduleKeyDeletion

risk_factors:
  severity: 8
  asset_criticality: 8
  exploitability: 7
  exposure: 6
  data_sensitivity: 7

recommended_actions:
  - Validate the identity that performed the API operation
  - Review the originating IP address
  - Review CloudTrail events surrounding the activity
  - Check whether MFA was used
  - Investigate related IAM changes
  - Contain the identity if the activity is unauthorized

mitre:
  tactic: Persistence
  techniques:
    - T1098