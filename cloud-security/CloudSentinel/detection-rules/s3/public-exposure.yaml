rules:
  - id: CS-S3-001
    name: Public S3 Exposure
    description: Detects findings indicating an S3 bucket is publicly accessible.
    severity: critical

    finding_types:
      - misconfiguration
      - compliance

    sources:
      - config
      - security_hub

    conditions:
      asset_types:
        - s3
      keywords:
        - public
        - public read
        - public access
        - bucket public

    remediation: >
      Remove public bucket policies and ACLs, enable S3 Block Public Access,
      and verify bucket access through AWS IAM and bucket policy analysis.

    tags:
      - aws
      - s3
      - exposure
      - misconfiguration