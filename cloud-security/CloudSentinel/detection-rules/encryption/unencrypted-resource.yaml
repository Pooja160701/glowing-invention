rules:
  - id: CS-ENC-001
    name: Unencrypted AWS Resource
    description: Detects resources that do not use encryption at rest.
    severity: high

    finding_types:
      - misconfiguration
      - compliance

    sources:
      - config
      - security_hub

    conditions:
      keywords:
        - unencrypted
        - encryption disabled
        - not encrypted
        - encryption at rest

    remediation: >
      Enable encryption at rest using AWS KMS-managed or customer-managed keys
      according to the resource security requirements.

    tags:
      - aws
      - encryption
      - kms