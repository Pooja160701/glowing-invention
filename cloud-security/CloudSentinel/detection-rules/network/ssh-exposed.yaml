rules:
  - id: CS-NET-001
    name: SSH Exposed to Internet
    description: Detects security group or configuration findings exposing SSH.
    severity: high

    finding_types:
      - misconfiguration
      - compliance

    sources:
      - config
      - security_hub

    conditions:
      keywords:
        - ssh
        - port 22
        - 0.0.0.0/0
        - unrestricted access

    remediation: >
      Restrict SSH access to approved administrative networks or use AWS Systems
      Manager Session Manager instead of exposing port 22 publicly.

    tags:
      - aws
      - network
      - ssh
      - exposure