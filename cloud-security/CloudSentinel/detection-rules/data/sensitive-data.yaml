rules:
  - id: CS-DATA-001
    name: Sensitive Data Detected
    description: Detects sensitive data findings discovered in AWS resources.
    severity: high

    finding_types:
      - sensitive_data

    sources:
      - macie

    conditions:
      asset_types:
        - s3

    remediation: >
      Review the affected S3 object and data classification. Remove unnecessary
      sensitive data, restrict access, and apply appropriate encryption and
      retention controls.

    tags:
      - aws
      - macie
      - sensitive-data
      - s3