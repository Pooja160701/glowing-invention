openapi: 3.0.3
info:
  title: FinFlow API
  version: 1.0.0
  description: Portfolio API contract for FinFlow.
servers:
  - url: https://api.example.invalid/api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: User profile
  /imports:
    post:
      summary: Create a transaction import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '202':
          description: Import accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /transactions:
    get:
      summary: List transactions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transaction page
  /transactions/{transactionId}:
    patch:
      summary: Update a transaction category
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated transaction
        '404':
          $ref: '#/components/responses/NotFound'
  /budgets:
    get:
      summary: List budgets
      responses:
        '200':
          description: Budget list
    post:
      summary: Create a budget
      responses:
        '201':
          description: Budget created
  /budgets/{budgetId}:
    get:
      summary: Get budget details
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget
  /goals:
    get:
      summary: List savings goals
      responses:
        '200':
          description: Goal list
    post:
      summary: Create savings goal
      responses:
        '201':
          description: Goal created
  /insights:
    get:
      summary: List explainable financial insights
      responses:
        '200':
          description: Insight list
  /insights/{insightId}/actions:
    post:
      summary: Record an insight action
      parameters:
        - $ref: '#/components/parameters/InsightId'
      responses:
        '201':
          description: Action recorded
  /notifications/preferences:
    get:
      summary: Get notification preferences
      responses:
        '200':
          description: Preferences
    put:
      summary: Replace notification preferences
      responses:
        '200':
          description: Preferences updated
  /feedback:
    post:
      summary: Submit product feedback
      responses:
        '201':
          description: Feedback accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
    InsightId:
      name: insightId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ImportRequest:
      type: object
      required: [source_type, idempotency_key]
      properties:
        source_type:
          type: string
          enum: [csv]
        idempotency_key:
          type: string
    CategoryUpdate:
      type: object
      required: [category]
      properties:
        category:
          type: string
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicting or duplicate operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
