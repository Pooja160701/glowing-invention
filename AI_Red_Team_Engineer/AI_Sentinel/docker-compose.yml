services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      AISENTINEL_ENV: docker
      AISENTINEL_AUDIT_PATH: /app/reports/audit.jsonl
      AISENTINEL_SANDBOX_ROOT: /app/sample_targets/sandbox
      AISENTINEL_KILL_SWITCH: "false"
    volumes:
      - ./reports:/app/reports
      - ./sample_targets:/app/sample_targets:ro
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      AISENTINEL_API_URL: http://api:8000
